<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    
    <!-- PWA and Mobile App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark" />
    
    <!-- Android Chrome Optimizations -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Kinetic Eco-Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Load fonts asynchronously */
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* slate-900 */
        color: #f8fafc; /* slate-50 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
        touch-action: manipulation; /* Improve touch responsiveness */
      }
      
      /* Mobile optimizations - Android and iOS */
      @media (max-width: 768px) {
        body {
          font-size: 16px; /* Prevent iOS zoom on input focus, optimal for Android readability */
        }
        
        /* Larger touch targets for mobile - Android Material Design recommends 48dp */
        button, a {
          min-height: 48px; /* Android Material Design recommendation (48dp) */
          min-width: 48px;
          padding: 12px 16px; /* Better touch area */
        }
      }
      
      /* Android-specific optimizations */
      @media screen and (max-width: 768px) {
        /* Prevent text size adjustment on Android */
        html {
          -webkit-text-size-adjust: 100%;
          text-size-adjust: 100%;
        }
        
        /* Better scrolling on Android */
        body {
          -webkit-overflow-scrolling: touch;
          overflow-scrolling: touch;
        }
      }
      
      /* Prevent text selection on buttons (mobile UX) */
      button {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        -webkit-touch-callout: none;
      }
      
      /* Ensure buttons are clickable on mobile */
      button:active {
        opacity: 0.8;
      }
      
      /* Prevent 300ms delay on mobile taps - but allow buttons to handle their own */
      * {
        touch-action: manipulation;
      }
      
      /* Buttons should allow manipulation for better mobile interaction */
      button {
        touch-action: manipulation;
      }
      
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      
      /* Safe area insets for notched devices */
      @supports (padding: max(0px)) {
        body {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
        }
        
        .safe-area-top {
          padding-top: max(0px, env(safe-area-inset-top));
        }
        
        .safe-area-bottom {
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }
        
        .safe-area-inset {
          padding-left: max(0px, env(safe-area-inset-left));
          padding-right: max(0px, env(safe-area-inset-right));
          padding-top: max(0px, env(safe-area-inset-top));
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
